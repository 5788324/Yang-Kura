name: Documentation Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'AI_HANDOFF/**'
      - 'scripts/verify-handoff.mjs'
      - '.github/workflows/docs-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Current handoff consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify current handoff and project facts
        run: node scripts/verify-handoff.mjs

      - name: Require current architecture references
        shell: bash
        run: |
          test -f docs/architecture/ARCHITECTURE_AUDIT.md
          test -f docs/architecture/DEPENDENCY_MAP.md
          test -f docs/architecture/REFACTOR_BACKLOG.md
          test -f docs/DESIGN.md
